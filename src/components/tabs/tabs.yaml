name: Tabs
macro: nhswTabs
description: >
  A set of tabs for switching between related blocks of content. Renders
  static initial markup only; shipped JS handles click and arrow-key
  switching.
params:
  - name: idPrefix
    type: string
    required: false
    description: Prefix for generated tab/panel ids. Defaults to "tabs".
  - name: items
    type: array
    required: true
    description: >
      List of { label, html, text, id, count }. label is the tab button
      text. count, if given, renders a badge after the label. html/text is
      the panel content (html takes precedence). id, if given, is used to
      build stable ids; otherwise the 1-based loop index is used.
  - name: classes
    type: string
    required: false
    description: Extra classes.
  - name: attributes
    type: object
    required: false
    description: Extra HTML attributes.
examples:
  - name: default
    data:
      idPrefix: "demo"
      items:
        - { label: "Past day", id: "day", html: "Panel 1 content" }
        - { label: "Past week", id: "week", html: "Panel 2 content" }
  - name: without-explicit-ids
    data:
      items:
        - { label: "Overview", text: "Overview content" }
        - { label: "Examples", text: "Examples content" }
  - name: with-count
    data:
      idPrefix: "demo"
      items:
        - { label: "Past day", id: "day", count: "112", html: "Panel 1 content" }
        - { label: "Past week", id: "week", html: "Panel 2 content" }
