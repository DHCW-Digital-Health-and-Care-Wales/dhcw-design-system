name: Panel
macro: nhswPanel
description: >
  A confirmation panel used to highlight the successful completion of a
  task, such as submitting an application, along with any reference details.
params:
  - name: titleText
    type: string
    required: true
    description: Panel heading text.
  - name: titleSize
    type: string
    required: false
    description: >
      "xl" (default, Heading XL: 48px, 32px on mobile), "l" (Heading L: 36px,
      27px on mobile) or "m" (Heading M: 26px, 22px on mobile). "l" and "m"
      add nhsw-panel__title--l or nhsw-panel__title--m. "l" also omits the
      icon, unless icon is explicitly set.
  - name: html
    type: string
    required: false
    description: Body HTML, used as-is. Required unless text is set.
  - name: text
    type: string
    required: false
    description: Body text, an alternative to html.
  - name: icon
    type: boolean
    required: false
    description: >
      Whether to render the tick icon. Defaults to true, unless titleSize
      is "l" (defaults to false).
  - name: classes
    type: string
    required: false
    description: "Extra classes. Colourway modifier: nhsw-panel--navy."
  - name: attributes
    type: object
    required: false
    description: Extra HTML attributes.
examples:
  - name: default
    data:
      titleText: "Application complete"
      html: "Your reference number<br><strong>HDJ2123F</strong>"
  - name: navy
    data:
      titleText: "Application complete"
      html: "Your reference number<br><strong>HDJ2123F</strong>"
      classes: "nhsw-panel--navy"
  - name: large-title
    data:
      titleText: "Application complete"
      titleSize: "l"
      html: "Your reference number<br><strong>HDJ2123F</strong>"
