<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example - {{ page.title | replace_first: ' example', '' }} - DHCW Design System</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/dhcw-icon.svg' | relative_url }}">
  {% include head-assets.html %}
</head>
<body class="nhsw-template-page">
  {{ content }}

  <script src="{{ '/dist/nhsw-behaviours.min.js' | relative_url }}"></script>
  <script>
    document.addEventListener("click", function (event) {
      var link = event.target.closest && event.target.closest("a[href=\"#\"]");
      if (link) event.preventDefault();
    });
  </script>
</body>
</html>
