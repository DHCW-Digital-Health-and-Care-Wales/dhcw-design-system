layout: example
title: Select with hint example

<div class="nhsw-form-group">
  <label class="nhsw-label nhsw-label--regular" for="select-hint">Choose region</label>
  <div class="nhsw-hint" id="select-hint-hint">This can be different to what you selected before</div>
  <select id="select-hint" class="nhsw-select" aria-describedby="select-hint-hint">
    <option>Choose region</option>
    <option>North Wales</option>
    <option>Mid Wales</option>
    <option>West Wales</option>
    <option>South Wales</option>
  </select>
</div>
