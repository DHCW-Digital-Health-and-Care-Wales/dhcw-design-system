---
layout: example
title: Error summary example
---
<div class="nhsw-error-summary" aria-labelledby="error-summary-title" role="alert" tabindex="-1">
  <h2 class="nhsw-h3 nhsw-error-summary__title" id="error-summary-title">There is a problem</h2>
  <ul class="nhsw-error-summary__list">
    <li><a class="nhsw-link nhsw-error-summary__link" href="#full-name">Enter your full name</a></li>
  </ul>
</div>

<h2 class="nhsw-h2">Your details</h2>
<div class="nhsw-form-group nhsw-form-group--error">
  <label class="nhsw-label" for="full-name">Full name</label>
  <p class="nhsw-error-message" id="full-name-error"><span class="nhsw-visually-hidden">Error: </span>Enter your full name</p>
  <input class="nhsw-input" id="full-name" name="full-name" type="text" aria-describedby="full-name-error" aria-invalid="true">
</div>
