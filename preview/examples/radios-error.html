---
layout: example
title: Radios error state example
---
<div class="nhsw-form-group nhsw-form-group--error">
  <fieldset class="nhsw-fieldset" aria-describedby="name-change-hint name-change-error">
    <legend class="nhsw-fieldset__legend nhsw-h2">Have you changed your name?</legend>
    <div class="nhsw-hint" id="name-change-hint">This includes changing your last name or spelling your name differently</div>
    <p class="nhsw-error-message" id="name-change-error"><span class="nhsw-visually-hidden">Error: </span>Select yes if you have changed your name</p>
    <div class="nhsw-radios">
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="name-change-yes" name="name-change" type="radio" value="yes" aria-invalid="true">
        <label class="nhsw-label nhsw-radios__label" for="name-change-yes">Yes</label>
      </div>
      <div class="nhsw-radios__item">
        <input class="nhsw-radios__input" id="name-change-no" name="name-change" type="radio" value="no" aria-invalid="true">
        <label class="nhsw-label nhsw-radios__label" for="name-change-no">No</label>
      </div>
    </div>
  </fieldset>
</div>
