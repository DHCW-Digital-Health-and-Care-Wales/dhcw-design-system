<div class="nhsw-warning-callout">
  <h3 class="nhsw-warning-callout__heading">
    <span class="nhsw-warning-callout__icon" aria-hidden="true">!</span>
    <span class="nhsw-warning-callout__heading-text"><span class="nhsw-visually-hidden">Important: </span>School, nursery or work</span>
  </h3>
  <div class="nhsw-warning-callout__content">
    <p class="nhsw-body">Stay away from school, nursery or work until all the spots have crusted over. This is usually 5 days after the spots first appeared.</p>
  </div>
</div>
