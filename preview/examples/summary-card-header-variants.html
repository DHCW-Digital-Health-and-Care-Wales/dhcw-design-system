---
layout: example
title: Summary card with and without a header example
---
<h2 class="nhsw-h2">With a header</h2>
<p class="nhsw-body">Title is set, so the card has a white background.</p>
<div class="nhsw-summary-card">
  <div class="nhsw-summary-card__header">
    <h3 class="nhsw-h3 nhsw-summary-card__title">Summary card header</h3>
  </div>
  <div class="nhsw-summary-card__body">
    <dl class="nhsw-summary-list">
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Key</dt>
        <dd class="nhsw-summary-list__value">Details</dd>
      </div>
    </dl>
  </div>
</div>

<h2 class="nhsw-h2">Without a header</h2>
<p class="nhsw-body">Title is not set, so the card has a transparent background.</p>
<div class="nhsw-summary-card">
  <div class="nhsw-summary-card__body">
    <dl class="nhsw-summary-list">
      <div class="nhsw-summary-list__row">
        <dt class="nhsw-summary-list__key">Key</dt>
        <dd class="nhsw-summary-list__value">Details</dd>
      </div>
    </dl>
  </div>
</div>
