<div class="nhsw-patient-header">
  <dl class="nhsw-summary-list nhsw-summary-list--no-border">
    <div class="nhsw-summary-list__row">
      <dt class="nhsw-summary-list__key">Name</dt>
      <dd class="nhsw-summary-list__value">Jane Doe</dd>
    </div>
    <div class="nhsw-summary-list__row">
      <dt class="nhsw-summary-list__key">Date of birth</dt>
      <dd class="nhsw-summary-list__value">1 January 1980</dd>
    </div>
    <div class="nhsw-summary-list__row">
      <dt class="nhsw-summary-list__key">NHS number</dt>
      <dd class="nhsw-summary-list__value">999 999 9999</dd>
    </div>
  </dl>
</div>
<h1 class="nhsw-h1">Patient record</h1>
<p class="nhsw-body">Patient information stays visible above the page content and is clearly separated from it.</p>
