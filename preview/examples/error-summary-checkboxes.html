---
layout: example
title: Error summary linking to checkboxes example
---
<div class="nhsw-error-summary" aria-labelledby="error-summary-title" role="alert" tabindex="-1">
  <h2 class="nhsw-h3 nhsw-error-summary__title" id="error-summary-title">There is a problem</h2>
  <ul class="nhsw-error-summary__list">
    <li><a class="nhsw-link nhsw-error-summary__link" href="#contact-1">Select how you want to be contacted</a></li>
  </ul>
</div>

<div class="nhsw-form-group nhsw-form-group--error">
  <fieldset class="nhsw-fieldset" aria-describedby="contact-hint contact-error">
    <legend class="nhsw-fieldset__legend nhsw-h2">How do you want to be contacted about this?</legend>
    <div class="nhsw-hint" id="contact-hint">Select all options that are relevant to you</div>
    <p class="nhsw-error-message" id="contact-error"><span class="nhsw-visually-hidden">Error: </span>Select how you want to be contacted</p>
    <div class="nhsw-checkboxes">
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="contact-1" name="contact" type="checkbox" value="email">
        <label class="nhsw-label nhsw-checkboxes__label" for="contact-1">Email</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="contact-2" name="contact" type="checkbox" value="phone">
        <label class="nhsw-label nhsw-checkboxes__label" for="contact-2">Phone</label>
      </div>
      <div class="nhsw-checkboxes__item">
        <input class="nhsw-checkboxes__input" id="contact-3" name="contact" type="checkbox" value="text">
        <label class="nhsw-label nhsw-checkboxes__label" for="contact-3">Text message</label>
      </div>
    </div>
  </fieldset>
</div>
