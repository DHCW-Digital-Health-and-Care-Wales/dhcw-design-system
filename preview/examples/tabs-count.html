---
layout: example
title: Tabs with a count badge example
---
<div class="nhsw-tabs">
  <ul class="nhsw-tabs__list" role="tablist">
    <li role="presentation">
      <button class="nhsw-tabs__tab nhsw-tabs__tab--selected" role="tab" aria-selected="true" aria-controls="demo-panel-day" id="demo-tab-day"><span class="nhsw-tabs__tab-text">Past day</span> <strong class="nhsw-tag nhsw-tag--blue">112</strong></button>
    </li>
    <li role="presentation">
      <button class="nhsw-tabs__tab" role="tab" aria-selected="false" aria-controls="demo-panel-week" id="demo-tab-week"><span class="nhsw-tabs__tab-text">Past week</span></button>
    </li>
    <li role="presentation">
      <button class="nhsw-tabs__tab" role="tab" aria-selected="false" aria-controls="demo-panel-month" id="demo-tab-month"><span class="nhsw-tabs__tab-text">Past month</span></button>
    </li>
    <li role="presentation">
      <button class="nhsw-tabs__tab" role="tab" aria-selected="false" aria-controls="demo-panel-year" id="demo-tab-year"><span class="nhsw-tabs__tab-text">Past year</span></button>
    </li>
  </ul>
  <div class="nhsw-tabs__panel" id="demo-panel-day" role="tabpanel" aria-labelledby="demo-tab-day">
    <h2 class="nhsw-h2">Past day</h2>
    <table class="nhsw-table">
      <thead class="nhsw-table__head">
        <tr class="nhsw-table__row">
          <th scope="col" class="nhsw-table__header">Case manager</th>
          <th scope="col" class="nhsw-table__header">Cases opened</th>
          <th scope="col" class="nhsw-table__header">Cases closed</th>
        </tr>
      </thead>
      <tbody class="nhsw-table__body">
        <tr class="nhsw-table__row">
          <td class="nhsw-table__cell">David Francis</td>
          <td class="nhsw-table__cell">3</td>
          <td class="nhsw-table__cell">0</td>
        </tr>
        <tr class="nhsw-table__row">
          <td class="nhsw-table__cell">Paul Farmer</td>
          <td class="nhsw-table__cell">1</td>
          <td class="nhsw-table__cell">0</td>
        </tr>
        <tr class="nhsw-table__row">
          <td class="nhsw-table__cell">Rita Patel</td>
          <td class="nhsw-table__cell">2</td>
          <td class="nhsw-table__cell">0</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="nhsw-tabs__panel nhsw-tabs__panel--hidden" id="demo-panel-week" role="tabpanel" aria-labelledby="demo-tab-week">
    <h2 class="nhsw-h2">Past week</h2>
    <p class="nhsw-body">Case activity for the past week.</p>
  </div>
  <div class="nhsw-tabs__panel nhsw-tabs__panel--hidden" id="demo-panel-month" role="tabpanel" aria-labelledby="demo-tab-month">
    <h2 class="nhsw-h2">Past month</h2>
    <p class="nhsw-body">Case activity for the past month.</p>
  </div>
  <div class="nhsw-tabs__panel nhsw-tabs__panel--hidden" id="demo-panel-year" role="tabpanel" aria-labelledby="demo-tab-year">
    <h2 class="nhsw-h2">Past year</h2>
    <p class="nhsw-body">Case activity for the past year.</p>
  </div>
</div>
