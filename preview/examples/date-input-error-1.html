---
layout: example
title: Date input error message 1 example
---
<div class="nhsw-form-group nhsw-form-group--error">
  <fieldset class="nhsw-fieldset" role="group" aria-describedby="dob-error-hint dob-error-message">
    <legend class="nhsw-fieldset__legend nhsw-h2">What is your date of birth?</legend>
    <div class="nhsw-hint" id="dob-error-hint">For example, 15 3 1984</div>
    <p class="nhsw-error-message" id="dob-error-message"><span class="nhsw-visually-hidden">Error: </span>The date of birth must be in the past</p>
    <div class="nhsw-date-input">
      <div class="nhsw-date-input__item">
        <label class="nhsw-label nhsw-date-input__label" for="dob-error-day">Day</label>
        <input id="dob-error-day" class="nhsw-input nhsw-date-input__input nhsw-date-input__input--day nhsw-is-invalid" type="text" inputmode="numeric" maxlength="2" value="1" aria-invalid="true">
      </div>
      <div class="nhsw-date-input__item">
        <label class="nhsw-label nhsw-date-input__label" for="dob-error-month">Month</label>
        <input id="dob-error-month" class="nhsw-input nhsw-date-input__input nhsw-date-input__input--month nhsw-is-invalid" type="text" inputmode="numeric" maxlength="2" value="12" aria-invalid="true">
      </div>
      <div class="nhsw-date-input__item">
        <label class="nhsw-label nhsw-date-input__label" for="dob-error-year">Year</label>
        <input id="dob-error-year" class="nhsw-input nhsw-date-input__input nhsw-date-input__input--year nhsw-is-invalid" type="text" inputmode="numeric" maxlength="4" value="2000" aria-invalid="true">
      </div>
    </div>
  </fieldset>
</div>
