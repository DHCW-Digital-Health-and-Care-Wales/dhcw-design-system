<div class="nhsw-form-group">
  <label class="nhsw-label nhsw-label--regular" for="select-xs">Extra small</label>
  <select id="select-xs" class="nhsw-select nhsw-select--xs">
    <option>Yes</option>
    <option>No</option>
  </select>
</div>
<div class="nhsw-form-group">
  <label class="nhsw-label nhsw-label--regular" for="select-s">Small</label>
  <select id="select-s" class="nhsw-select nhsw-select--s">
    <option>Wales</option>
    <option>England</option>
    <option>Scotland</option>
  </select>
</div>
<div class="nhsw-form-group">
  <label class="nhsw-label nhsw-label--regular" for="select-m">Medium</label>
  <select id="select-m" class="nhsw-select nhsw-select--m">
    <option>North Wales</option>
    <option>Mid Wales</option>
    <option>West Wales</option>
    <option>South Wales</option>
  </select>
</div>
<div class="nhsw-form-group">
  <label class="nhsw-label nhsw-label--regular" for="select-l">Large</label>
  <select id="select-l" class="nhsw-select nhsw-select--l">
    <option>Longer select option</option>
    <option>Another longer option</option>
  </select>
</div>
<div class="nhsw-form-group">
  <label class="nhsw-label nhsw-label--regular" for="select-xl">Extra large</label>
  <select id="select-xl" class="nhsw-select nhsw-select--xl">
    <option>Very long select option for wider layouts</option>
    <option>Another very long option</option>
  </select>
</div>
