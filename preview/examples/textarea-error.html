title: Textarea error state example
---
<div class="nhsw-form-group nhsw-form-group--error">
  <label class="nhsw-label" for="ta-reason-err">Provide a reason for continuing</label>
  <p class="nhsw-error-message" id="ta-reason-err-error"><span class="nhsw-visually-hidden">Error: </span>Error the clinical decision</p>
  <textarea id="ta-reason-err" name="ta-reason-err" class="nhsw-textarea nhsw-is-invalid" aria-invalid="true" aria-describedby="ta-reason-err-error ta-reason-err-count" data-max-length="150" data-max-length-target="ta-reason-err-count"></textarea>
  <div class="nhsw-hint nhsw-textarea__count" id="ta-reason-err-count">You have 150 characters remaining</div>
</div>
