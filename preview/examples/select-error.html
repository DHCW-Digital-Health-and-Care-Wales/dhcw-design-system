---
layout: example
title: Select error state example
---
<div class="nhsw-form-group nhsw-form-group--error">
  <label class="nhsw-label" for="select-err">Choose region</label>
  <div class="nhsw-hint" id="select-err-hint">This can be different to what you selected before</div>
  <p class="nhsw-error-message" id="select-err-error"><span class="nhsw-visually-hidden">Error: </span>Choose a region</p>
  <select id="select-err" class="nhsw-select nhsw-is-invalid" aria-invalid="true" aria-describedby="select-err-hint select-err-error">
    <option>Choose region</option>
    <option>North Wales</option>
    <option>Mid Wales</option>
    <option>West Wales</option>
    <option>South Wales</option>
  </select>
</div>
