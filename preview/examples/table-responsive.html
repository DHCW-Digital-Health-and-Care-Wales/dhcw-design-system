layout: example
title: Responsive table example
---
<table class="nhsw-table-responsive" role="table">
  <caption class="nhsw-table__caption nhsw-table__caption--m nhsw-caption-m">Vaccination schedule</caption>
  <thead class="nhsw-table__head" role="rowgroup">
    <tr class="nhsw-table__row" role="row">
      <th scope="col" class="nhsw-table__header" role="columnheader">Age</th>
      <th scope="col" class="nhsw-table__header" role="columnheader">Vaccine</th>
      <th scope="col" class="nhsw-table__header" role="columnheader">How it is given</th>
    </tr>
  </thead>
  <tbody class="nhsw-table__body" role="rowgroup">
    <tr class="nhsw-table__row" role="row">
      <th scope="row" class="nhsw-table__header" role="rowheader">
        <span class="nhsw-table-responsive__heading" aria-hidden="true">Age </span>
        8 weeks
      </th>
      <td class="nhsw-table__cell" role="cell">
        <span class="nhsw-table-responsive__heading" aria-hidden="true">Vaccine </span>
        6-in-1 vaccine
      </td>
      <td class="nhsw-table__cell" role="cell">
        <span class="nhsw-table-responsive__heading" aria-hidden="true">How it is given </span>
        Injection into the thigh
      </td>
    </tr>
    <tr class="nhsw-table__row" role="row">
      <th scope="row" class="nhsw-table__header" role="rowheader">
        <span class="nhsw-table-responsive__heading" aria-hidden="true">Age </span>
        12 weeks
      </th>
      <td class="nhsw-table__cell" role="cell">
        <span class="nhsw-table-responsive__heading" aria-hidden="true">Vaccine </span>
        Rotavirus
      </td>
      <td class="nhsw-table__cell" role="cell">
        <span class="nhsw-table-responsive__heading" aria-hidden="true">How it is given </span>
        Drops into the mouth
      </td>
    </tr>
  </tbody>
</table>
