<header class="nhsw-site-header">
  <div class="nhsw-site-header__container nhsw-site-header__container--wide">
    <div class="nhsw-site-header__top">
      <a class="nhsw-site-header__brand" href="{{ '/prototype-kit/index.html' | relative_url }}">
        <span class="nhsw-site-header__logo">
          <img src="{{ '/assets/nhsw-logo.svg' | relative_url }}" alt="NHS Wales Digital Health and Care Wales">
        </span>
        <span class="nhsw-site-header__title">Prototype kit</span>
      </a>
      <form class="nhsw-site-header__search" role="search" onsubmit="return false;">
        <label class="nhsw-visually-hidden" for="prototype-kit-search">Search the prototype kit</label>
        <input id="prototype-kit-search" class="nhsw-site-header__search-input" type="search" placeholder="Search the prototype kit" autocomplete="off">
        <button class="nhsw-site-header__search-button" type="submit" aria-label="Search"></button>
      </form>
    </div>
  </div>
</header>
