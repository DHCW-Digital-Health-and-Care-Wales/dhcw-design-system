<header class="nhsw-site-header">
  <div class="nhsw-site-header__container">
    <div class="nhsw-site-header__top">
      <a class="nhsw-site-header__brand" href="{{ '/index.html' | relative_url }}">
        <span class="nhsw-site-header__logo">
          <img src="{{ '/assets/nhsw-logo.svg' | relative_url }}" alt="NHS Wales Digital Health and Care Wales">
        </span>
        <span class="nhsw-site-header__title">Design system</span>
      </a>
      {% unless page.hide_header_search %}
      <form class="nhsw-site-header__search" role="search" action="{{ '/search.html' | relative_url }}" method="get">
        <label class="nhsw-visually-hidden" for="site-search">Search the design system</label>
        <input id="site-search" class="nhsw-site-header__search-input" type="search" name="q" placeholder="Search the design system" autocomplete="off">
        <button class="nhsw-site-header__search-button" type="submit" aria-label="Search"></button>
      </form>
      {% endunless %}
    </div>
  </div>
</header>
