name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
        default: patch
      publish_npm:
        description: Publish to npm (pre-release versions go to the rc tag)
        required: true
        type: choice
        options:
          - none
          - dry-run
          - publish
        default: none

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Build JS
        run: npm run build:js

      - name: Run unit/CSS tests
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Bump version
        id: version
        run: |
          npm version ${{ inputs.bump }} --preid=rc --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package Nunjucks components
        run: npm run package:njk

      - name: Prepare npm package files
        run: node scripts/prepare-npm-package.js

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist/nhsw.css dist/nhsw.min.css dist/nhsw-behaviours.js dist/nhsw-behaviours.min.js dist/nhsw-date-picker.js dist/nhsw-date-picker.min.js dist/nhsw-nunjucks-components.zip
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            preview/dist/nhsw.css
            preview/dist/nhsw.css.map
            preview/dist/nhsw.min.css
            preview/dist/nhsw-date-picker.js
            preview/dist/nhsw-date-picker.min.js
            preview/dist/nhsw-behaviours.js
            preview/dist/nhsw-behaviours.min.js
            dist/nhsw-nunjucks-components.zip

      - name: Publish to npm
        if: ${{ inputs.publish_npm != 'none' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then TAG=rc; else TAG=latest; fi
          ARGS="--tag $TAG --access public"
          if [ "${{ github.event.repository.private }}" = "false" ]; then ARGS="$ARGS --provenance"; fi
          if [ "${{ inputs.publish_npm }}" = "dry-run" ]; then ARGS="$ARGS --dry-run"; fi
          npm publish $ARGS
